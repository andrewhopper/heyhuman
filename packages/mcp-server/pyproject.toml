[project]
name = "heyhuman-mcp"
version = "0.1.0"
description = "MCP server that lets an agent ask a human through a one-time link (HeyHuman, experimental)"
requires-python = ">=3.11"
dependencies = ["mcp>=2"]

[project.scripts]
heyhuman-mcp = "heyhuman_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["heyhuman_mcp.py"]
