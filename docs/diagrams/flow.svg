inter-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/></g></g><g data-cell-id="c8"><g transform="translate(0.5,0.5)"><rect x="16" y="368" width="80" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#596678" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(89, 102, 120), rgb(140, 152, 167));"><text x="18" y="382.5">ANSWER</text></g></g></g><g data-cell-id="c9"><g><rect x="10" y="598" width="1160" height="136" rx="4" ry="4" fill="#f8fafc" stroke="none" pointer-events="all" style="fill: light-dark(rgb(248, 250, 252), rgb(21, 23, 25));"/></g></g><g data-cell-id="c10"><g transform="translate(0.5,0.5)"><rect x="16" y="598" width="80" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#596678" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start" font-size="11px" style="fill: light-dark(rgb(89, 102, 120), rgb(140, 152, 167));"><text x="18" y="612.5">RETURN</text></g></g></g><g data-cell-id="c11"><g><rect x="25" y="70" width="150" height="40" rx="4" ry="4" fill="#e7f1fc" stroke="#0c72df" stroke-width="1.5" pointer-events="all" style="fill: light-dark(rgb(231, 241, 252), rgb(24, 32, 42)); stroke: light-dark(rgb(12, 114, 223), rgb(75, 163, 255));"/></g><g><g fill="#0F172A" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: light-dark(rgb(15, 23, 42), rgb(211, 218, 234));"><text x="100" y="95.5">Agent</text></g></g></g><g data-cell-id="c12"><g transform="translate(0.5,0.5)"><path d="M 100 110 L 100 752" fill="none" stroke="#e2e8f0" stroke-width="1.25" stroke-miterlimit="10" stroke-dasharray="7.5 5" pointer-events="stroke" style="stroke: light-dark(rgb(226, 232, 240), rgb(34, 39, 46));"/></g></g><g