, rgb(18, 18, 18));"/><text x="394" y="200">2  session + SessionCreated, one transaction</text></g></g></g><g data-cell-id="c25"><g><path d="M 296 252 L 109.18 252" fill="none" stroke="#0c72df" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="9 6" pointer-events="stroke" style="stroke: light-dark(rgb(12, 114, 223), rgb(75, 163, 255));"/><path d="M 101.68 252 L 109.18 249.5 L 109.18 254.5 Z" fill="#0c72df" stroke="#0c72df" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(12, 114, 223), rgb(75, 163, 255)); stroke: light-dark(rgb(12, 114, 223), rgb(75, 163, 255));"/></g><g><g fill="#0C72DF" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(12, 114, 223), rgb(75, 163, 255));"><rect fill="#FFFFFF" stroke="none" x="90" y="235" width="217" height="15" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="198" y="246">3  session id + link, token in #fragment</text></g></g></g><g data-cell-id="c26"><g><path d="M 100 298 L 1070.82 298" fill="none" stroke="#596678" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="9 6" pointer-events="stroke" style="stroke: light-dark(rgb(89, 102, 120), rgb(140, 152, 167));"/><path d="M 1078.32 298 L 1070.82 300.5 L 1070.82 295.5 Z" fill="#596678" stroke="#596678" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(89, 102, 120), rgb(140, 152, 167)); stroke: light-dark(rgb(89, 102, 120), rgb(140, 152, 167));"/></g><g><g fill="#596678" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" font-size="12px" style="fill: light-dark(rgb(89, 102, 120), rgb(140, 152, 167));"><rect fill="#FFFFFF" stroke="none" x="485" y="281" width="212" height="15" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="590" y="292">4  send